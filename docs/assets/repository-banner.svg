<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="ttl desc">
<title id="ttl">Calibration Transfer of Conformal Prediction</title>
<desc id="desc">Scientific illustration of interval calibration across composition regimes. The intervals are schematic and do not show experimental results.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071425"/><stop offset=".55" stop-color="#11284e"/><stop offset="1" stop-color="#1b224c"/></linearGradient>
<linearGradient id="grad"><stop stop-color="#72caff"/><stop offset="1" stop-color="#a28bff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#90b9ff" stop-opacity=".27"/><stop offset="1" stop-color="#90b9ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<circle cx="955" cy="135" r="235" fill="url(#glow)"/>
<text x="60" y="55" fill="#8bc0ff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">REPRODUCIBLE SCIENTIFIC MODELLING</text>
<text x="60" y="115" fill="#ffffff" font-family="Arial,sans-serif" font-size="41" font-weight="800">Calibration Transfer</text>
<text x="60" y="161" fill="#ffffff" font-family="Arial,sans-serif" font-size="41" font-weight="800">of Conformal Prediction</text>
<path d="M60 189H603" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<text x="60" y="233" fill="#c3d5f0" font-family="Arial,sans-serif" font-size="18">Concrete strength · Composition regimes · Prediction intervals</text>
